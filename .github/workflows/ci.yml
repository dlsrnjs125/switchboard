name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Test and build
        run: ./gradlew clean build
      - name: Validate contracts
        run: ./gradlew :contracts:check
      - name: Validate Docker Compose
        run: docker compose -f infra/docker/docker-compose.yml config --quiet
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.2
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /tmp kubeconform
      - name: Validate Helm and Kubernetes manifests
        run: |
          helm lint infra/helm/switchboard
          helm template switchboard infra/helm/switchboard --namespace switchboard > /tmp/switchboard.yaml
          /tmp/kubeconform -strict -summary -kubernetes-version 1.31.0 /tmp/switchboard.yaml
          helm template switchboard infra/helm/switchboard --namespace switchboard \
            --set controlPlane.autoscaling.enabled=true \
            --set distribution.autoscaling.enabled=true > /tmp/switchboard-autoscaling.yaml
          /tmp/kubeconform -strict -summary -kubernetes-version 1.31.0 /tmp/switchboard-autoscaling.yaml
