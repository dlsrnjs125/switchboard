spring:
  application:
    name: switchboard-control-plane
  datasource:
    url: ${SWITCHBOARD_DB_URL:jdbc:postgresql://localhost:5432/switchboard}
    username: ${SWITCHBOARD_DB_USER:switchboard}
    password: ${SWITCHBOARD_DB_PASSWORD:switchboard-local}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SWITCHBOARD_OIDC_JWK_SET_URI:http://localhost:9000/.well-known/jwks.json}
  kafka:
    template:
      observation-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${SWITCHBOARD_TRACE_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${SWITCHBOARD_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-},spanId=%X{spanId:-}]"

server:
  shutdown: graceful

switchboard:
  outbox:
    relay:
      enabled: ${SWITCHBOARD_OUTBOX_RELAY_ENABLED:false}
    topic: ${SWITCHBOARD_OUTBOX_TOPIC:switchboard.snapshot-published.v1}
    poll-interval: ${SWITCHBOARD_OUTBOX_POLL_INTERVAL:PT1S}
