spring:
  application:
    name: switchboard-control-plane
  datasource:
    url: ${SWITCHBOARD_DB_URL:jdbc:postgresql://localhost:5432/switchboard}
    username: ${SWITCHBOARD_DB_USER:switchboard}
    password: ${SWITCHBOARD_DB_PASSWORD:switchboard-local}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SWITCHBOARD_OIDC_JWK_SET_URI:http://localhost:9000/.well-known/jwks.json}

server:
  shutdown: graceful
