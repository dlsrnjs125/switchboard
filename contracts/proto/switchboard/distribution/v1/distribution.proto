syntax = "proto3";
package switchboard.distribution.v1;
option java_multiple_files = true;
option java_package = "io.github.dlsrnjs125.switchboard.contracts.distribution.v1";

service SnapshotDistributionService {
  rpc Subscribe(SubscribeRequest) returns (stream ServerMessage);
  rpc Acknowledge(AckRequest) returns (AckResponse);
  rpc Reject(NackRequest) returns (NackResponse);
  rpc RequestResync(ResyncRequest) returns (ResyncResponse);
}

message SubscribeRequest {
  string client_application_key = 1;
  string project_key = 2;
  string environment_key = 3;
  uint64 last_applied_snapshot_version = 4;
  uint32 supported_schema_version = 5;
}
message ServerMessage {
  oneof body {
    FullSnapshot full_snapshot = 1;
    Heartbeat heartbeat = 2;
    ResyncRequired resync_required = 3;
    CredentialRevoked credential_revoked = 4;
  }
  reserved 5 to 15;
}
message FullSnapshot {
  uint64 snapshot_version = 1;
  uint32 schema_version = 2;
  string checksum = 3;
  bytes canonical_json = 4;
  string delivery_id = 5;
}
message Heartbeat { int64 server_time_epoch_millis = 1; uint64 current_snapshot_version = 2; }
message ResyncRequired { string reason_code = 1; uint64 current_snapshot_version = 2; }
message CredentialRevoked { string credential_id = 1; }
message AckRequest { string client_application_key = 1; string environment_key = 2; uint64 snapshot_version = 3; string checksum = 4; string delivery_id = 5; }
message AckResponse { bool accepted = 1; }
message NackRequest { string client_application_key = 1; string environment_key = 2; uint64 snapshot_version = 3; string reason_code = 4; string detail = 5; }
message NackResponse { bool accepted = 1; }
message ResyncRequest { string client_application_key = 1; string environment_key = 2; uint64 last_applied_snapshot_version = 3; string reason_code = 4; }
message ResyncResponse { bool accepted = 1; }
