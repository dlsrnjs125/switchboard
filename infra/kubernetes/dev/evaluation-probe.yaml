apiVersion: batch/v1
kind: Job
metadata:
  name: switchboard-evaluation-probe
  labels:
    app.kubernetes.io/name: switchboard-evaluation-probe
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: switchboard-evaluation-probe
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: switchboard/sample-service:phase8
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: SWITCHBOARD_DISTRIBUTION_ENDPOINT
              value: switchboard-switchboard-distribution:9090
            - name: SWITCHBOARD_SERVICE_CREDENTIAL
              valueFrom:
                secretKeyRef:
                  name: switchboard-phase8-probe
                  key: credential
            - name: SWITCHBOARD_CLIENT_APPLICATION
              value: orders
            - name: SWITCHBOARD_PROJECT
              value: checkout
            - name: SWITCHBOARD_ENVIRONMENT
              value: production
            - name: SWITCHBOARD_LKG_PATH
              value: /tmp/lkg.json
            - name: SWITCHBOARD_DEMO_PLAN
              value: premium
            - name: SWITCHBOARD_EXPECTED_BOOLEAN
              value: "false"
            - name: SWITCHBOARD_EVALUATION_ITERATIONS
              value: "600"
            - name: SWITCHBOARD_EVALUATION_INTERVAL_MILLIS
              value: "100"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
